		<style>

				font-weight: 500;
				font-style: normal;
				font-display: swap;
			}
			:root { --font-md-thermochrome: 'MD Thermochrome', ui-sans-serif, system-ui, sans-serif; }

			.intro-pipe-connector { z-index: 20; }

				#ow_carousel_track { transition: none; transform: none !important; }
			}
			@media (prefers-reduced-motion: reduce) {
				#ow_carousel_track { transition: none !important; }
			}

					<div class="px-2 py-1 text-sm xl:text-base leading-tight bg-green-900 border border-green-700 font-medium">First Post!</div>
					<div id="ow_post_0_status" class="text-xs xl:text-sm leading-tight text-neutral-500 opacity-0">scheduled</div>
				</div>

				</div>

				<div id="ow_post_2" class="border border-neutral-700 p-2 bg-neutral-800 flex flex-col gap-1.5">
					<div class="text-sm xl:text-base text-neutral-400 leading-tight">Feb 15</div>

					<div id="ow_post_2_status" class="text-xs xl:text-sm leading-tight text-neutral-500 opacity-0">scheduled</div>
				</div>

		<!-- Mobile: slide indicators -->
		<div id="ow_carousel_dots" class="max-md:flex md:hidden items-center justify-center gap-2 py-2">
			<button type="button" data-ow-dot="0" class="ow-dot h-2.5 w-2.5 rounded-full bg-neutral-600 transition-colors ring-offset-2 ring-offset-black focus:outline-none focus:ring-2 focus:ring-green-500/60" aria-label="Calendar"></button>
			<button type="button" data-ow-dot="1" class="ow-dot h-2.5 w-2.5 rounded-full bg-neutral-600 transition-colors ring-offset-2 ring-offset-black focus:outline-none focus:ring-2 focus:ring-green-500/60" aria-label="Outputs"></button>
			<button type="button" data-ow-dot="2" class="ow-dot h-2.5 w-2.5 rounded-full bg-neutral-600 transition-colors ring-offset-2 ring-offset-black focus:outline-none focus:ring-2 focus:ring-green-500/60" aria-label="Platforms"></button>
		</div>

	</div><!-- /ow_root -->

	<script>
		document.addEventListener('DOMContentLoaded', () => {

			const DRAW_DUR   = 0.5;
			const STREAM_DUR = 0.9;
			const PAUSE      = 2.8;

			const pipeStreamIntervals = new Set();
			let waveGen = 0;

			const mqCarousel = window.matchMedia('(max-width: 767px)');
			function isCarouselMode() { return mqCarousel.matches; }

			let carouselIndex = 0;
			const SLIDE_CAL  = 0;
			const SLIDE_OUT  = 1;
			const SLIDE_PLAT = 2;

			function updateDots() {
				document.querySelectorAll('#ow_carousel_dots .ow-dot').forEach((dot) => {
					const i = Number(dot.getAttribute('data-ow-dot'));
					const on = i === carouselIndex;
					dot.classList.toggle('bg-green-500', on);
					dot.classList.toggle('bg-neutral-600', !on);
					dot.classList.toggle('scale-125', on);
				});
			}

			function goTo(i, animate = true) {
				if (!isCarouselMode()) return;
				const track = document.getElementById('ow_carousel_track');
				if (!track) return;
				carouselIndex = Math.max(0, Math.min(2, i));
				if (!animate) track.style.transition = 'none';
				track.style.transform = `translateX(-${carouselIndex * 33.333}%)`;
				if (!animate) { track.offsetHeight; track.style.transition = ''; }
				updateDots();
			}

			function syncLayout() {
				const track = document.getElementById('ow_carousel_track');
				if (!track) return;
				if (!isCarouselMode()) {
					track.style.transform = '';
					carouselIndex = 0;
					updateDots();
				} else {
					goTo(carouselIndex, false);
				}
			}

			function pipeLen(el) {
				if (!el) return 0;
				if (el.getTotalLength) return el.getTotalLength();
				const x1 = el.x1?.baseVal?.value ?? 0, x2 = el.x2?.baseVal?.value ?? 0;
				const y1 = el.y1?.baseVal?.value ?? 0, y2 = el.y2?.baseVal?.value ?? 0;
				return Math.hypot(x2 - x1, y2 - y1);
			}

			function resetLineSvg(svgEl, visible) {
				if (!svgEl) return;
				svgEl.querySelectorAll('.pipe-stream-pixel').forEach(n => n.remove());
				const line = svgEl.querySelector('.pipe-line');
				if (!line) return;
				const len = pipeLen(line);
				gsap.set(line, { strokeDasharray: len, strokeDashoffset: visible ? 0 : len, opacity: 1 });
				svgEl.classList.toggle('opacity-0', !visible);
				svgEl.classList.toggle('opacity-100', visible);
			}

			function clearStreams() {
				pipeStreamIntervals.forEach(id => clearInterval(id));
				pipeStreamIntervals.clear();
				document.querySelectorAll('.pipe-stream-pixel').forEach(n => n.remove());
				gsap.killTweensOf('.pipe-line');
			}

			function flashBorder(el, color, tl, position = '+=0') {
				if (!el || !tl) return;
				const base = getComputedStyle(el).borderColor;
				tl.fromTo(el, { borderColor: base }, {
					borderColor: color, repeat: 3, yoyo: true, duration: 0.12, ease: 'power2.inOut'
				}, position);
			}

			function drawAndStream(masterTl, svgEl, gen, color, skipDraw) {
				if (isCarouselMode()) {
					masterTl.to({}, { duration: (skipDraw ? 0 : DRAW_DUR) + STREAM_DUR });
					return;
				}
				const line = svgEl?.querySelector('.pipe-line');
				if (!line) { masterTl.to({}, { duration: (skipDraw ? 0 : DRAW_DUR) + STREAM_DUR }); return; }

				const len = pipeLen(line);
				const dx  = Math.abs((line.x2?.baseVal?.value ?? 0) - (line.x1?.baseVal?.value ?? 0));
				const dy  = Math.abs((line.y2?.baseVal?.value ?? 0) - (line.y1?.baseVal?.value ?? 0));
				const vert = dy > dx;
				const PW = vert ? 3 : 4, PH = vert ? 4 : 3, SPD = 0.18, INT = 55;
				const x0 = (line.x1?.baseVal?.value ?? 0) - PW / 2;
				const y0 = (line.y1?.baseVal?.value ?? 0) - PH / 2;
				const tp = vert ? 'y' : 'x';
				const td = len - (vert ? PH : PW);
				const glow = vert ? `drop-shadow(0 3px 5px ${color})` : `drop-shadow(3px 0 5px ${color})`;

				if (!skipDraw) {
					masterTl.call(() => {
						if (gen !== waveGen) return;
						svgEl.querySelectorAll('.pipe-stream-pixel').forEach(n => n.remove());
						svgEl.classList.remove('opacity-0'); svgEl.classList.add('opacity-100');
						gsap.set(line, { strokeDasharray: len, strokeDashoffset: len, opacity: 1 });
					});
					masterTl.to(line, { strokeDashoffset: 0, duration: DRAW_DUR, ease: 'power2.inOut' });
				}

				masterTl.call(() => {
					if (gen !== waveGen) return;
					const t0 = performance.now();
					const id = setInterval(() => {
						if (gen !== waveGen || performance.now() - t0 > STREAM_DUR * 1000) {
							clearInterval(id); pipeStreamIntervals.delete(id); return;
						}
						const px = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
						px.classList.add('pipe-stream-pixel');
						px.setAttribute('width', PW); px.setAttribute('height', PH);
						px.setAttribute('x', x0); px.setAttribute('y', y0);
						px.setAttribute('fill', color); px.setAttribute('rx', '1');
						svgEl.appendChild(px);
						gsap.fromTo(px, { [tp]: 0, opacity: 1 }, {
							[tp]: td, duration: SPD, ease: 'none',
							filter: `blur(1px) ${glow}`,
							onComplete() { if (svgEl.contains(px)) svgEl.removeChild(px); }
						});
					}, INT);
					pipeStreamIntervals.add(id);
				});
				masterTl.to({}, { duration: STREAM_DUR });
			}

			const platformIds   = ['ow_plat_youtube', 'ow_plat_tiktok', 'ow_plat_instagram', 'ow_plat_facebook', 'ow_plat_github'];
			const platformColors = ['#FF0000', '#ffffff', '#FF0069', '#0866FF', '#ffffff'];

			function resetAll() {
				clearStreams();
				resetLineSvg(document.getElementById('ow_pipe_cal_out'), false);
				resetLineSvg(document.getElementById('ow_pipe_out_plat'), false);

				for (let i = 0; i < 3; i++) {
					const postEl   = document.getElementById(`ow_post_${i}`);
					const statusEl = document.getElementById(`ow_post_${i}_status`);
					if (postEl)   gsap.set(postEl, { clearProps: 'borderColor' });
					if (statusEl) {
						gsap.set(statusEl, { autoAlpha: 0 });
						statusEl.textContent = 'scheduled';
						statusEl.className = 'text-xs xl:text-sm leading-tight text-neutral-500';
					}
				}
				// Make.com is always the active output — others stay dimmed
				gsap.set('#ow_out_make', { clearProps: 'borderColor' });
				// All platforms stay at full opacity
				platformIds.forEach(id => gsap.set(`#${id}`, { clearProps: 'borderColor' }));
			}

			function runCycle() {
				waveGen++;
				const gen = waveGen;
				resetAll();
				if (isCarouselMode()) goTo(SLIDE_CAL, false);

				const pipeCtoO  = document.getElementById('ow_pipe_cal_out');
				const pipeOtoP  = document.getElementById('ow_pipe_out_plat');
				const makeEl    = document.getElementById('ow_out_make');

				const tl = gsap.timeline({
					defaults: { ease: 'power2.out' },
					onComplete: () => gsap.delayedCall(PAUSE, runCycle)
				});

				for (let i = 0; i < 3; i++) {
					const postEl   = document.getElementById(`ow_post_${i}`);
					const statusEl = document.getElementById(`ow_post_${i}_status`);

					// 1. Flash calendar post
					tl.call(() => {
						if (gen !== waveGen) return;
						if (isCarouselMode()) goTo(SLIDE_CAL);
						if (statusEl) {
							statusEl.textContent = '⏳ sending…';
							statusEl.className = 'text-xs xl:text-sm leading-tight text-neutral-500';
						}
					}, null, '+=0.3');
					tl.to(statusEl, { autoAlpha: 1, duration: 0.2 }, '<0.05');
					flashBorder(postEl, '#22c55e', tl, '<');

					// Calendar → Outputs pipe
					drawAndStream(tl, pipeCtoO, gen, '#22c55e', i > 0);

					tl.call(() => {
						if (gen !== waveGen) return;
						if (isCarouselMode()) goTo(SLIDE_OUT);
					});

					// 2. Flash Make.com
					flashBorder(makeEl, '#6D00CC', tl, '+=0');
					tl.to({}, { duration: 0.2 });

					// Outputs → Platforms pipe
					drawAndStream(tl, pipeOtoP, gen, '#22c55e', i > 0);

					tl.call(() => {
						if (gen !== waveGen) return;
						if (isCarouselMode()) goTo(SLIDE_PLAT);
					});

					// 3. Flash all platforms one after the other
					flashBorder(document.getElementById('ow_plat_youtube'),   '#FF0000', tl, '+=0');
					flashBorder(document.getElementById('ow_plat_tiktok'),    '#ffffff', tl, '+=0.1');
					flashBorder(document.getElementById('ow_plat_instagram'), '#FF0069', tl, '+=0.1');
					flashBorder(document.getElementById('ow_plat_facebook'),  '#0866FF', tl, '+=0.1');
					flashBorder(document.getElementById('ow_plat_github'),    '#ffffff', tl, '+=0.1');

					// Update calendar post status to published
					tl.call(() => {
						if (gen !== waveGen) return;
						if (isCarouselMode()) goTo(SLIDE_CAL);
						if (statusEl) {
							statusEl.textContent = '✓ published';
							statusEl.className = 'text-xs xl:text-sm leading-tight text-green-400';
						}
						if (postEl) gsap.set(postEl, { borderColor: '#22c55e' });
					}, null, '+=0.1');
					tl.to(statusEl, { autoAlpha: 1, duration: 0.25 }, '<0.05');
				}
			}

			document.querySelectorAll('#ow_carousel_dots .ow-dot').forEach((dot) => {
				dot.addEventListener('click', () => goTo(Number(dot.getAttribute('data-ow-dot'))));
			});

			const vp = document.getElementById('ow_carousel_viewport');
			if (vp) {
				let swipeX = 0;
				vp.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, { passive: true });
				vp.addEventListener('touchend', e => {
					if (!isCarouselMode()) return;
					const dx = e.changedTouches[0].clientX - swipeX;
					if (dx < -48) goTo(carouselIndex + 1);
					else if (dx > 48) goTo(carouselIndex - 1);
				}, { passive: true });
			}

			mqCarousel.addEventListener('change', syncLayout);
			window.addEventListener('resize', syncLayout);

			updateDots();
			if (isCarouselMode()) goTo(SLIDE_CAL, false);
			runCycle();
		});
	</script>
