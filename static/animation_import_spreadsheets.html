<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Spreadsheet Import Demo</title>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

		<style>
			@font-face {
				font-family: 'MD Thermochrome';
				src: url('/fonts/MDThermochrome0.3-Medium.otf') format('opentype');
				font-weight: 500;
				font-style: normal;
				font-display: swap;
			}
			:root { --font-md-thermochrome: 'MD Thermochrome', ui-sans-serif, system-ui, sans-serif; }
			.font-md-thermochrome { font-family: var(--font-md-thermochrome); }
			.intro-pipe-connector { z-index: 20; }
			#ss_carousel_track { transition: transform 0.45s cubic-bezier(0.33, 1, 0.68, 1); }
			@media (min-width: 768px) {
				#ss_carousel_track { transition: none; transform: none !important; }
			}
			@media (prefers-reduced-motion: reduce) {
				#ss_carousel_track { transition: none !important; }
			}
		</style>

		<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
	</head>

	<body class="p-2 xl:p-3 font-sans antialiased bg-black">
	<div id="ss_root" class="font-md-thermochrome text-white flex flex-col gap-0">

		<div id="ss_top_row" class="min-w-0 max-md:block md:grid md:grid-cols-3 md:items-start md:gap-3 xl:gap-4">

			<div id="ss_carousel_viewport" class="max-md:w-full max-md:overflow-hidden md:contents touch-pan-y">
				<div id="ss_carousel_track" class="flex max-md:w-[300%] md:contents max-md:will-change-transform">

			<!-- ── SLIDE 1: SPREADSHEET ── -->

			<div id="ss_source"

				<div class="text-lg xl:text-xl leading-tight mb-0.5">SPREADSHEET</div>

						<span>Date</span><span>Title</span><span>Status</span>
					</div>

						<span class="text-neutral-400">Feb 1</span>
						<span class="truncate">Launch post</span>
						<span class="text-neutral-500">draft</span>
					</div>
					<div id="ss_row_1" class="grid grid-cols-3 gap-1 text-xs xl:text-sm py-0.5 rounded">

						<span class="truncate">Digest #12</span>
						<span class="text-neutral-500">draft</span>
					</div>
					<div id="ss_row_2" class="grid grid-cols-3 gap-1 text-xs xl:text-sm py-0.5 rounded">
						<span class="text-neutral-400">Feb 15</span>
						<span class="truncate">How-to guide</span>
						<span class="text-neutral-500">draft</span>
					</div>

		<!-- Mobile: slide indicators -->
	<div id="ss_carousel_dots" class="max-md:flex md:hidden items-center justify-center gap-2 py-2">
		<button type="button" data-ss-dot="0" class="ss-dot h-2.5 w-2.5 rounded-full bg-neutral-600 transition-colors ring-offset-2 ring-offset-black focus:outline-none focus:ring-2 focus:ring-green-500/60" aria-label="Spreadsheet"></button>
		<button type="button" data-ss-dot="1" class="ss-dot h-2.5 w-2.5 rounded-full bg-neutral-600 transition-colors ring-offset-2 ring-offset-black focus:outline-none focus:ring-2 focus:ring-green-500/60" aria-label="Inputs"></button>
		<button type="button" data-ss-dot="2" class="ss-dot h-2.5 w-2.5 rounded-full bg-neutral-600 transition-colors ring-offset-2 ring-offset-black focus:outline-none focus:ring-2 focus:ring-green-500/60" aria-label="Schedules & Calendar"></button>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {

			const DRAW_DUR   = 0.5;
			const STREAM_DUR = 0.9;
			const PAUSE      = 3.0;

			const pipeStreamIntervals = new Set();
			let waveGen = 0;

			const mqCarousel = window.matchMedia('(max-width: 767px)');
			function isCarouselMode() { return mqCarousel.matches; }

			let carouselIndex = 0;
			const SLIDE_SRC = 0, SLIDE_IN = 1, SLIDE_SCHED = 2;

			function updateDots() {
				document.querySelectorAll('#ss_carousel_dots .ss-dot').forEach((dot) => {
					const i = Number(dot.getAttribute('data-ss-dot'));
					const on = i === carouselIndex;
					dot.classList.toggle('bg-green-500', on);
					dot.classList.toggle('bg-neutral-600', !on);
					dot.classList.toggle('scale-125', on);
				});
			}

			function goTo(i, animate = true) {
				if (!isCarouselMode()) return;
				const track = document.getElementById('ss_carousel_track');
				if (!track) return;
				carouselIndex = Math.max(0, Math.min(2, i));
				if (!animate) track.style.transition = 'none';
				track.style.transform = `translateX(-${carouselIndex * 25}%)`;
				if (!animate) { track.offsetHeight; track.style.transition = ''; }
				updateDots();
			}

			function syncLayout() {
				const track = document.getElementById('ss_carousel_track');
				if (!track) return;
				if (!isCarouselMode()) { track.style.transform = ''; carouselIndex = 0; updateDots(); }
				else goTo(carouselIndex, false);
			}

			function pipeLen(el) {
				if (!el) return 0;
				if (el.getTotalLength) return el.getTotalLength();
				const x1 = el.x1?.baseVal?.value ?? 0, x2 = el.x2?.baseVal?.value ?? 0;
				const y1 = el.y1?.baseVal?.value ?? 0, y2 = el.y2?.baseVal?.value ?? 0;
				return Math.hypot(x2 - x1, y2 - y1);
			}

			function resetLineSvg(svgEl, visible) {
				if (!svgEl) return;
				svgEl.querySelectorAll('.pipe-stream-pixel').forEach(n => n.remove());
				const line = svgEl.querySelector('.pipe-line');
				if (!line) return;
				const len = pipeLen(line);
				gsap.set(line, { strokeDasharray: len, strokeDashoffset: visible ? 0 : len, opacity: 1 });
				svgEl.classList.toggle('opacity-0', !visible);
				svgEl.classList.toggle('opacity-100', visible);
			}

			function clearStreams() {
				pipeStreamIntervals.forEach(id => clearInterval(id));
				pipeStreamIntervals.clear();
				document.querySelectorAll('.pipe-stream-pixel').forEach(n => n.remove());
				gsap.killTweensOf('.pipe-line');
			}

			function flashBorder(el, color, tl, position = '+=0') {
				if (!el || !tl) return;
				const base = getComputedStyle(el).borderColor;
				tl.fromTo(el, { borderColor: base }, {
					borderColor: color, repeat: 3, yoyo: true, duration: 0.12, ease: 'power2.inOut'
				}, position);
			}

			function drawAndStream(masterTl, svgEl, gen, color, skipDraw) {
				if (isCarouselMode()) {
					masterTl.to({}, { duration: (skipDraw ? 0 : DRAW_DUR) + STREAM_DUR });
					return;
				}
				const line = svgEl?.querySelector('.pipe-line');
				if (!line) { masterTl.to({}, { duration: (skipDraw ? 0 : DRAW_DUR) + STREAM_DUR }); return; }

				const len = pipeLen(line);
				const dx  = Math.abs((line.x2?.baseVal?.value ?? 0) - (line.x1?.baseVal?.value ?? 0));
				const dy  = Math.abs((line.y2?.baseVal?.value ?? 0) - (line.y1?.baseVal?.value ?? 0));
				const vert = dy > dx;
				const PW = vert ? 3 : 4, PH = vert ? 4 : 3, SPD = 0.18, INT = 55;
				const x0 = (line.x1?.baseVal?.value ?? 0) - PW / 2;
				const y0 = (line.y1?.baseVal?.value ?? 0) - PH / 2;
				const tp = vert ? 'y' : 'x';
				const td = len - (vert ? PH : PW);
				const glow = vert ? `drop-shadow(0 3px 5px ${color})` : `drop-shadow(3px 0 5px ${color})`;

				if (!skipDraw) {
					masterTl.call(() => {
						if (gen !== waveGen) return;
						svgEl.querySelectorAll('.pipe-stream-pixel').forEach(n => n.remove());
						svgEl.classList.remove('opacity-0'); svgEl.classList.add('opacity-100');
						gsap.set(line, { strokeDasharray: len, strokeDashoffset: len, opacity: 1 });
					});
					masterTl.to(line, { strokeDashoffset: 0, duration: DRAW_DUR, ease: 'power2.inOut' });
				}

				masterTl.call(() => {
					if (gen !== waveGen) return;
					const t0 = performance.now();
					const id = setInterval(() => {
						if (gen !== waveGen || performance.now() - t0 > STREAM_DUR * 1000) {
							clearInterval(id); pipeStreamIntervals.delete(id); return;
						}
						const px = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
						px.classList.add('pipe-stream-pixel');
						px.setAttribute('width', PW); px.setAttribute('height', PH);
						px.setAttribute('x', x0); px.setAttribute('y', y0);
						px.setAttribute('fill', color); px.setAttribute('rx', '1');
						svgEl.appendChild(px);
						gsap.fromTo(px, { [tp]: 0, opacity: 1 }, {
							[tp]: td, duration: SPD, ease: 'none',
							filter: `blur(1px) ${glow}`,
							onComplete() { if (svgEl.contains(px)) svgEl.removeChild(px); }
						});
					}, INT);
					pipeStreamIntervals.add(id);
				});
				masterTl.to({}, { duration: STREAM_DUR });
			}

			function resetAll() {
				clearStreams();
				['ss_pipe_src_in', 'ss_pipe_in_sched', 'ss_pipe_sched_cal'].forEach(id => {
					resetLineSvg(document.getElementById(id), false);
				});
				gsap.set('#ss_input_csv', { clearProps: 'borderColor' });
				gsap.set(['#ss_sched_0', '#ss_sched_1'], { opacity: 0 });
				gsap.set(['#ss_post_0', '#ss_post_1', '#ss_post_2'], { opacity: 0 });
				// Reset row highlights
				for (let i = 0; i < 3; i++) {
					const r = document.getElementById(`ss_row_${i}`);
					if (r) gsap.set(r, { clearProps: 'backgroundColor,color' });
				}
			}

			function runCycle() {
				waveGen++;
				const gen = waveGen;
				resetAll();

				if (isCarouselMode()) goTo(SLIDE_SRC, false);

				const tl = gsap.timeline({
					defaults: { ease: 'power2.out' },
					onComplete: () => gsap.delayedCall(PAUSE, runCycle)
				});

				// Highlight all spreadsheet rows at once (bulk read)
				tl.call(() => {
					if (gen !== waveGen) return;
					if (isCarouselMode()) goTo(SLIDE_SRC);
					for (let i = 0; i < 3; i++) {
						const r = document.getElementById(`ss_row_${i}`);
						if (r) gsap.fromTo(r,
							{ backgroundColor: 'transparent' },
							{ backgroundColor: 'rgba(34,197,94,0.18)', repeat: 1, yoyo: true, duration: 0.2, ease: 'power2.inOut',
							  onComplete: () => gsap.set(r, { clearProps: 'backgroundColor' }) }
						);
					}
				}, null, '+=0.3');

				tl.to({}, { duration: 0.6 });

				// Source → Inputs pipe
				drawAndStream(tl, document.getElementById('ss_pipe_src_in'), gen, '#22c55e', false);

				tl.call(() => {
					if (gen !== waveGen) return;
					if (isCarouselMode()) goTo(SLIDE_IN);
				});

				// Flash Inputs CSV row
				flashBorder(document.getElementById('ss_input_csv'), '#22c55e', tl, '+=0');

				// Inputs → Schedules pipe
				drawAndStream(tl, document.getElementById('ss_pipe_in_sched'), gen, '#22c55e', false);

				tl.call(() => {
					if (gen !== waveGen) return;
					if (isCarouselMode()) goTo(SLIDE_SCHED);
				});

				// Schedules appear (all at once)
				tl.to('#ss_sched_0', { opacity: 1, duration: 0.25 }, '+=0.1');
				tl.to('#ss_sched_1', { opacity: 1, duration: 0.25 }, '<0.1');

				flashBorder(document.getElementById('ss_sched_0'), '#22c55e', tl, '+=0.15');

				// Schedules → Calendar pipe (vertical)
				drawAndStream(tl, document.getElementById('ss_pipe_sched_cal'), gen, '#22c55e', false);

				// All calendar posts appear rapidly
				tl.to('#ss_post_0', { opacity: 1, duration: 0.3 }, '+=0.1');
				tl.to('#ss_post_1', { opacity: 1, duration: 0.3 }, '<0.15');
				tl.to('#ss_post_2', { opacity: 1, duration: 0.3 }, '<0.15');

				flashBorder(document.getElementById('ss_post_0'), '#22c55e', tl, '+=0.15');
				flashBorder(document.getElementById('ss_post_1'), '#22c55e', tl, '+=0.1');
				flashBorder(document.getElementById('ss_post_2'), '#22c55e', tl, '+=0.1');

				// Calendar → Platforms pipe
			}

			document.querySelectorAll('#ss_carousel_dots .ss-dot').forEach((dot) => {
				dot.addEventListener('click', () => goTo(Number(dot.getAttribute('data-ss-dot'))));
			});

			const vp = document.getElementById('ss_carousel_viewport');
			if (vp) {
				let swipeX = 0;
				vp.addEventListener('touchstart', e => { swipeX = e.touches[0].clientX; }, { passive: true });
				vp.addEventListener('touchend', e => {
					if (!isCarouselMode()) return;
					const dx = e.changedTouches[0].clientX - swipeX;
					if (dx < -48) goTo(carouselIndex + 1);
					else if (dx > 48) goTo(carouselIndex - 1);
				}, { passive: true });
			}

			mqCarousel.addEventListener('change', syncLayout);
			window.addEventListener('resize', syncLayout);

			updateDots();
			if (isCarouselMode()) goTo(SLIDE_SRC, false);
			runCycle();
		});
	</script>

	</body>
</html>
