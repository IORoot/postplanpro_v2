services:
  app:
    # Local: omit DEPLOY_IMAGE (defaults to postplanpro-v2:local) and use `docker compose up --build`.
    # CI deploy: set DEPLOY_IMAGE=ghcr.io/owner/repo:sha in `.env` and use pull + `up --no-build` on the server.
    image: ${DEPLOY_IMAGE:-postplanpro-v2:local}
    build: .
    # Full host side of the mapping, e.g. 3000 or 127.0.0.1:3001 (lock to localhost for a reverse proxy on the host)
    ports:
      - "${HOST_PORT_BINDING:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/postplan.db
      # Required in production (see src/auth.ts)
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env or the environment}
      # Must be passed explicitly; relying only on env_file can omit vars from the container env in some setups.
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env or the environment}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      # Public URL of the app (OAuth, Stripe redirects, cron base URL)
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Single-container Docker has no system cron — run the due-post poller inside the app process.
      # Disable if you use an external caller to GET /api/cron/send-due-posts (e.g. multiple replicas).
      ENABLE_INTERNAL_CRON: ${ENABLE_INTERNAL_CRON:-true}
    env_file:
      - path: .env
        required: false
    volumes:
      - postplan_data:/data
    restart: unless-stopped

volumes:
  postplan_data:
