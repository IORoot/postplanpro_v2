# Deploy: build the image on GitHub-hosted runners (RAM/CPU), pull and restart on your droplet (lightweight).
#
# This avoids `docker compose --build` on a small shared server (Vite + Bun + better-sqlite3 compile can
# trigger heavy swap / kswapd and slow PHP, nginx, and everything else on the same host).
#
# Runner labels: `runs-on` must match your self-hosted runner (Settings → Actions → Runners).
#
# Repository secret (required):
#   ENV_BASE_64 — entire `.env` file, Base64-encoded (no line breaks in the secret value is safest).
#   Must include CRON_SECRET. APP_BASE_URL is still required for the running app (OAuth, etc.). Host cron uses
#   scripts/postplan-cron-hit.sh which defaults to http://127.0.0.1:3000 so nginx does not strip X-Cron-Secret.
#
# GitHub Packages: the workflow pushes to GHCR (`ghcr.io/<lowercase owner>/<lowercase repo>:<sha>`).
# The default GITHUB_TOKEN must be allowed to write packages (enabled by `permissions` below).

name: 🚀 Deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_image: ${{ steps.image.outputs.deploy_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image coordinates (GHCR requires lowercase)
        id: image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "deploy_image=ghcr.io/${REPO_LC}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=ghcr.io/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.deploy_image }}
            ${{ steps.image.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull and restart on server
    needs: build-image
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write .env, pin image, pull, restart
        env:
          ENV_BASE_64: ${{ secrets.ENV_BASE_64 }}
          DEPLOY_IMAGE: ${{ needs.build-image.outputs.deploy_image }}
        run: |
          set -euo pipefail
          umask 077
          : "${ENV_BASE_64:?Set repository secret ENV_BASE_64 (base64-encoded .env)}"
          : "${DEPLOY_IMAGE:?Missing image from build job}"
          printf '%s' "$ENV_BASE_64" | base64 -d > .env
          test -s .env || { echo "Decoded .env is empty; check ENV_BASE_64 encoding." >&2; exit 1; }
          printf '\nDEPLOY_IMAGE=%s\n' "$DEPLOY_IMAGE" >> .env
          # Host crontab is installed in the next step; avoid two pollers unless ENV_BASE_64 sets ENABLE_INTERNAL_CRON explicitly.
          if ! grep -q '^ENABLE_INTERNAL_CRON=' .env; then
            printf '\nENABLE_INTERNAL_CRON=false\n' >> .env
          fi
          docker compose pull app
          docker compose up -d --no-build --remove-orphans

      - name: Install host crontab (send-due-posts every minute)
        run: |
          set -euo pipefail
          REPO_ROOT="$(pwd)"
          CRON_SCRIPT="${REPO_ROOT}/scripts/postplan-cron-hit.sh"
          test -x "$CRON_SCRIPT" || chmod +x "$CRON_SCRIPT"
          TMP="$(mktemp)"
          # Remove any previous entry for this job (same path or old checkout path) so deploys do not duplicate.
          (crontab -l 2>/dev/null || true) \
            | grep -vF 'postplan-cron-hit.sh' \
            | grep -vF '# postplan: send due posts (managed by deploy workflow)' \
            > "$TMP" || true
          {
            cat "$TMP"
            echo "# postplan: send due posts (managed by deploy workflow)"
            echo "* * * * * $CRON_SCRIPT"
          } | crontab -
          rm -f "$TMP"
          echo "Crontab entry for $CRON_SCRIPT installed (runs every minute)."
