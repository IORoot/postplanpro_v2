name: 🚥 Test - Trivy

on:
  workflow_dispatch: {}
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    env:
      # Pin release; bump when you want a newer scanner (see https://github.com/aquasecurity/trivy/releases)
      TRIVY_VERSION: '0.69.3'
    steps:
      - uses: actions/checkout@v4

      # Install from GitHub releases instead of aquasecurity/setup-trivy (avoids composite install.sh failures on some runners).
      - name: Install Trivy
        run: |
          set -eux
          case "${RUNNER_ARCH}" in
            X64) suffix=Linux-64bit ;;
            ARM64) suffix=Linux-ARM64 ;;
            *) echo "Unsupported RUNNER_ARCH=${RUNNER_ARCH}"; exit 1 ;;
          esac
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${suffix}.tar.gz" \
            | sudo tar -xzf - -C /usr/local/bin trivy
          trivy --version

      - name: Run Trivy fs scan (SARIF + JSON)
        run: |
          set -eux
          trivy fs \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --format sarif \
            --exit-code 0 \
            --output trivy-results.sarif \
            .
          trivy fs \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            --format json \
            --exit-code 0 \
            --output trivy-results.json \
            .

      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-results.sarif
            trivy-results.json
          if-no-files-found: ignore
