# NVD updates are slow without an API key (100k+ records, rate limits).
#
# Add a repository secret named NVD_API_KEY:
#   https://nvd.nist.gov/developers/request-an-api-key
# The workflow passes it as --nvdApiKey when the secret is set.
#
# The dependency-check-data/ directory is cached between runs so the NVD database is not
# re-downloaded from scratch every time (first run or cache miss can still take a long time).

name: 🚥 Test - OWASP Dependency-Check

on:
  workflow_dispatch: {}
  schedule:
    - cron: '47 5 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare directories
        run: mkdir -p dependency-check-data dependency-check-report

      - name: Cache NVD / dependency-check data
        uses: actions/cache@v4
        with:
          path: dependency-check-data
          key: odc-11.1-data-${{ runner.os }}-v1
          restore-keys: |
            odc-11.1-data-${{ runner.os }}-

      - name: Run OWASP Dependency-Check (Docker)
        run: |
          EXTRA_ARGS=()
          if [ -n "${NVD_API_KEY:-}" ]; then
            EXTRA_ARGS+=(--nvdApiKey "$NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY secret is not set — NVD updates are much slower. Request a key: https://nvd.nist.gov/developers/request-an-api-key"
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:rw" \
            -v "$GITHUB_WORKSPACE/dependency-check-data:/usr/share/dependency-check/data:rw" \
            owasp/dependency-check:11.1.0 \
            --scan /src \
            --project "postplanpro-v2" \
            --format HTML \
            --format JSON \
            --format SARIF \
            --out /src/dependency-check-report \
            --nodePackageSkipDevDependencies false \
            --exclude "**/node_modules/**" \
            --exclude "**/dependency-check-data/**" \
            --exclude "**/dependency-check-report/**" \
            "${EXTRA_ARGS[@]}"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Find Dependency-Check SARIF
        id: depcheck_sarif
        if: always()
        run: |
          path=$(find dependency-check-report -maxdepth 1 -name '*.sarif' -print -quit)
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Upload Dependency-Check SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.depcheck_sarif.outputs.path != ''
        continue-on-error: true
        with:
          sarif_file: ${{ steps.depcheck_sarif.outputs.path }}
          category: dependency-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dependency-check-report/
          if-no-files-found: ignore
